name: Deploy portfolio site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          ref: portfolio-site

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set deployment URL
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          SITE_URL="https://${OWNER}.github.io/${REPO}"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Prepare SEO for deployment path
        run: python tools/update-seo.py --site-url "$SITE_URL"

      - name: Validate static site
        run: python tools/validate_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
